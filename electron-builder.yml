# dsh-desktop packaging: three-platform targets. The engine lives outside
# the asar: extraResources copies resources/engine (and the fallback
# resources/node) into the app bundle's Resources dir, exactly where the
# runtime looks (`process.resourcesPath/engine`) and with real file paths
# for require.resolve + native addons. scripts/ ships inside the asar so the
# in-app engine update (`updater:apply`) can run install-engine.mjs.
appId: ai.deepseek.dshdesktop
productName: dsh-desktop
# electron-updater release source. GitHub Releases is the default provider;
# owner/repo come from .env (GH_OWNER/GH_REPO) via electron-builder's
# ${env.X} macro — keep them in sync with package.json's `repository` field.
# Publishing happens when CI runs with GH_TOKEN and a git tag/draft release
# is present (electron-builder's default `onTagOrDraft`); plain `pnpm build`
# never publishes.
publish:
  provider: github
  owner: ${env.GH_OWNER}
  repo: ${env.GH_REPO}
directories:
  output: release
files:
  - dist/**/*
  - scripts/**/*.mjs
  - package.json
extraResources:
  # electron-builder prunes a root-level `node_modules` under an extraResources
  # source (filter.js root-relative rule), so the engine's dependency tree is
  # declared as its own source whose children never start with `node_modules`.
  - from: resources/engine
    to: engine
  - from: resources/engine/node_modules
    to: engine/node_modules
  # Windows-only hosting constraint (see resources/windows-hide.cjs): shipped
  # outside the asar with a real file path so the engine process can load it
  # via `--require` under ELECTRON_RUN_AS_NODE.
  - from: resources/windows-hide.cjs
    to: windows-hide.cjs
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # 签名身份由 electron-builder.config.cjs 动态计算（electron-builder 不对
  # mac.identity 做 ${env.X} 宏展开，静态 yml 无法条件化）：
  #   - 配置了证书（CSC_NAME 非空）→ identity 空字符串，证书身份由 CSC_NAME
  #     显式指定（配合 CSC_LINK/CSC_KEY_PASSWORD）。
  #   - 未配置证书 → identity '-'（ad-hoc，与引入签名前的行为一致）。
  # 路线一自签名证书：`pnpm run sign-cert` 一键生成 p12 + 写入 .env.local +
  # 信任证书；CI 用 secret DSH_MAC_CSC_LINK / DSH_MAC_CSC_KEY_PASSWORD 注入
  # （.github/workflows/build.yml 有信任步骤）。Squirrel.Mac 校验更新包与已装
  # 应用必须是同一签名身份，所以**每个版本都用同一个 .p12 签名**。
  # 详见 README「macOS 签名（路线一：自签名证书，免费）」。
  # Notarization requires the hardened runtime; it is on by default for
  # non-MAS builds, but we pin it explicitly so the intent is visible.
  hardenedRuntime: true
  #
  # Notarization is opt-in per build via env vars (electron-builder 26 uses
  # `notarytool`; one of these credential sets activates it, otherwise the
  # step is skipped with a warning — it never fails the build):
  #   1. APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER   (recommended)
  #   2. APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
  #   3. APPLE_KEYCHAIN + APPLE_KEYCHAIN_PROFILE
  notarize: true
  target:
    # zip is required by electron-updater for macOS auto-updates; dmg alone
    # cannot serve delta updates.
    #
    # No `arch` is pinned here on purpose: a build targets the machine it
    # runs on. Local `pnpm build` on an Intel Mac → x64 package; the CI mac
    # runner (macos-15, arm64) → arm64 package. The two arch artifacts are
    # merged into one GitHub release by scripts/publish-release.mjs
    # (--with-x64 mode).
    - dmg
    - zip
dmg:
  # DMG volume icon; defaults to the app icon otherwise.
  icon: build/icon.icns
win:
  # png is auto-converted to .ico by electron-builder.
  icon: build/icon.png
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
