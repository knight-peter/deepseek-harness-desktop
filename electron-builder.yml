# dsh-desktop packaging: three-platform targets. The engine lives outside
# the asar: extraResources copies resources/engine (and the fallback
# resources/node) into the app bundle's Resources dir, exactly where the
# runtime looks (`process.resourcesPath/engine`) and with real file paths
# for require.resolve + native addons. scripts/ ships inside the asar so the
# in-app engine update (`updater:apply`) can run install-engine.mjs.
appId: ai.deepseek.dshdesktop
productName: dsh-desktop
directories:
  output: release
files:
  - dist/**/*
  - scripts/**/*.mjs
  - package.json
extraResources:
  # electron-builder prunes a root-level `node_modules` under an extraResources
  # source (filter.js root-relative rule), so the engine's dependency tree is
  # declared as its own source whose children never start with `node_modules`.
  - from: resources/engine
    to: engine
  - from: resources/engine/node_modules
    to: engine/node_modules
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  target:
    # zip is required by electron-updater for macOS auto-updates; dmg alone
    # cannot serve delta updates.
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Development
