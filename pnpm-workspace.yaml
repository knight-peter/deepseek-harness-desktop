# electron-builder 26.15.3 references ElectronDownloadCacheMode, which only
# exists in @electron/get >= 5; its own declared ^3.0.0 range resolves to a
# version missing the export (upstream dependency-declaration bug).
overrides:
  '@electron/get': 5.1.0
allowBuilds:
  electron-winstaller: false
minimumReleaseAgeExclude:
  - pnpm@11.22.0
patchedDependencies:
  '@electron/osx-sign@1.3.3': patches/@electron__osx-sign@1.3.3.patch
