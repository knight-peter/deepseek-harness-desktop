name: build

on:
  push:
    # ONLY version tags (v*) trigger the full build+release pipeline. Plain
    # pushes to any branch do NOT run CI — the release flow is: tag → CI
    # builds 3 platforms & creates the GitHub release → local Intel x64
    # artifacts are merged in via scripts/publish-x64.mjs.
    tags: ['v*']
  workflow_dispatch:

# Cancel an in-flight run for the same ref when a newer push lands; keeps
# CI cost down during fast iteration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is the Apple Silicon (arm64) runner — the only mac build
        # CI ships (Intel x64 packages are built locally and merged into the
        # release by scripts/publish-x64.mjs; see docs/开发总结.md §4.6).
        # Pin the concrete label instead of macos-latest so a future label
        # change cannot silently switch the runner arch.
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          pnpm run lint
          pnpm run typecheck

      - name: Install engine (registry, pinned)
        run: pnpm run install-engine

      - name: Rebuild engine native modules for Electron
        run: pnpm run rebuild-engine

      - name: Compile shell (tsc + copy static)
        run: pnpm run compile

      - name: Engine smoke (Electron-as-Node boot + health + shutdown)
        run: pnpm run smoke

      - name: Package (electron-builder → release/)
        # Explicit bash: the unset guards below are POSIX syntax, but Windows
        # runners default to PowerShell. GitHub provides Git Bash on all
        # runners, so pinning shell:bash keeps one code path everywhere.
        shell: bash
        # Publish policy: plain main pushes pass `--publish never`; tag pushes
        # (v*) pass `--publish onTagOrDraft` so electron-builder creates or
        # updates the GitHub release. VERIFIED on pnpm 11: `pnpm run build --`
        # appends the `--` itself to the script line (yargs then treats it as a
        # positional separator and the flag is ignored), so write the args
        # WITHOUT a leading `--`: `pnpm run build --publish never`.
        run: |
          # electron-builder treats an EMPTY CSC_LINK as a certificate path
          # ("allow to specify as empty string"), so an unset secret (GitHub
          # renders it as '') crashes with "<projectDir> not a file". Only
          # expose the signing/notarization vars when a real secret exists;
          # unset them otherwise so cert lookup is skipped cleanly.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          pnpm run build ${{ startsWith(github.ref, 'refs/tags/') && '--publish onTagOrDraft' || '--publish never' }}
        env:
          # publish.owner/repo in electron-builder.yml use ${env.GH_OWNER} /
          # ${env.GH_REPO} macros (defined in .env locally); CI has no .env
          # file, so provide them here — keep in sync with .env + package.json
          # `repository`.
          GH_OWNER: knight-peter
          GH_REPO: deepseek-harness-desktop
          # macOS signing/notarization creds; the shell unset above removes
          # them when the secrets are absent.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  # After the three-platform build created the GitHub release, mirror it to
  # the GitCode `latest` release (domestic update feed). Runs inside GitHub's
  # network, so downloading our own release assets is fast — a domestic
  # machine cannot pull them (see docs/plans/国内发布与多更新源方案.md §8.1).
  # NOTE: at this point the release has no x64 mac artifacts yet (those are
  # merged later by the local publish-x64 step); run the sync-domestic
  # workflow again after publish-x64 to add them.
  sync:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # sync-domestic is dependency-free (node built-ins + fetch); no install.
      - name: Sync release to GitCode mirror
        run: pnpm run sync-domestic --from-github --tag ${{ github.ref_name }}
        env:
          # GITHUB_TOKEN can read the draft release's assets; GITCODE_TOKEN
          # must be configured in the repository secrets (scope: api).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
