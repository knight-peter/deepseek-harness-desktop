name: build

on:
  push:
    # ONLY version tags (v*) trigger the full build+release pipeline. Plain
    # pushes to any branch do NOT run CI — the release flow is: tag → CI
    # builds 3 platforms & creates the GitHub release → local Intel x64
    # artifacts are merged in via scripts/publish-release.mjs (--with-x64).
    tags: ['v*']
  workflow_dispatch:

# Cancel an in-flight run for the same ref when a newer push lands; keeps
# CI cost down during fast iteration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is the Apple Silicon (arm64) runner — the only mac build
        # CI ships (Intel x64 packages are built locally and merged into the
        # release by scripts/publish-release.mjs (--with-x64); see
        # docs/发布总结.md §4.3).
        # Pin the concrete label instead of macos-latest so a future label
        # change cannot silently switch the runner arch.
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          pnpm run lint
          pnpm run typecheck

      - name: Install engine (registry, pinned)
        run: pnpm run install-engine

      - name: Rebuild engine native modules for Electron
        run: pnpm run rebuild-engine

      - name: Compile shell (tsc + copy static)
        run: pnpm run compile

      - name: Engine smoke (Electron-as-Node boot + health + shutdown)
        run: pnpm run smoke

      - name: Package (electron-builder → release/)
        # Explicit bash: the unset guards below are POSIX syntax, but Windows
        # runners default to PowerShell. GitHub provides Git Bash on all
        # runners, so pinning shell:bash keeps one code path everywhere.
        shell: bash
        # Publish policy: plain main pushes pass `--publish never`; tag pushes
        # (v*) pass `--publish onTagOrDraft` so electron-builder creates or
        # updates the GitHub release. VERIFIED on pnpm 11: `pnpm run build --`
        # appends the `--` itself to the script line (yargs then treats it as a
        # positional separator and the flag is ignored), so write the args
        # WITHOUT a leading `--`: `pnpm run build --publish never`.
        # macOS packaging died with `EMFILE: too many open files` while
        # osx-sign walked the app bundle (the engine alone is ~34k files):
        # its walkAsync opened every file concurrently, and macOS runners cap
        # open files via kern.maxfilesperproc (independent of `ulimit -n`,
        # and only changeable with sudo). Two fixes, both kept:
        #   1. osx-sign walkAsync serialized via pnpm patchedDependencies
        #      (see patches/@electron__osx-sign@1.3.3.patch; upstream
        #      electron/osx-sign#286 is still open) — the definitive fix,
        #      needs only a handful of fds;
        #   2. raise the kernel cap + fd limit anyway (belt & suspenders for
        #      any other fd-hungry step; sudo is passwordless on runners).
        run: |
          sudo sysctl -w kern.maxfilesperproc=1048576 2>/dev/null || true
          sudo sysctl -w kern.maxfiles=1048576 2>/dev/null || true
          ulimit -n unlimited 2>/dev/null || ulimit -n 1048576 2>/dev/null || ulimit -n 65536 2>/dev/null || true
          echo "package step fd limit: $(ulimit -n)"
          # electron-builder treats an EMPTY CSC_LINK as a certificate path
          # ("allow to specify as empty string"), so an unset secret (GitHub
          # renders it as '') crashes with "<projectDir> not a file". Only
          # expose the signing/notarization vars when a real secret exists;
          # unset them otherwise so cert lookup is skipped cleanly.
          # macOS 优先用路线一自签名证书 secret（DSH_MAC_*），兼容旧 CSC_LINK。
          if [ "$RUNNER_OS" = "macOS" ]; then
            export CSC_LINK="${DSH_MAC_CSC_LINK:-$CSC_LINK}"
            export CSC_KEY_PASSWORD="${DSH_MAC_CSC_KEY_PASSWORD:-$CSC_KEY_PASSWORD}"
          fi
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          # 路线一自签名证书：electron-builder 26 用 CSC_LINK 的 p12 自建临时钥匙串并
          # `security find-identity -v` 找身份；`-v` 只认**已被系统信任**的证书。所以
          # 把自签名证书加进**系统/管理员信任域（admin trust）**即可让它认成 valid。
          # 用 `sudo ...`（不加 `-k login.keychain-db`），避免之前 -k 用户钥匙串时在
          # headless runner 上挂起钥匙串授权（2h+）。
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$DSH_MAC_CSC_LINK" ]; then
            # secret 粘贴时可能带入换行/空格（多行 base64 合法，但须先清空白
            # 再解码；引号等非 base64 字符则直接报错并给出修复指引）。
            printf '%s' "$DSH_MAC_CSC_LINK" | tr -d '[:space:]' > "$RUNNER_TEMP/dsh-release.b64"
            if ! base64 -d -i "$RUNNER_TEMP/dsh-release.b64" > "$RUNNER_TEMP/dsh-release.p12" 2>/dev/null; then
              echo "::error::DSH_MAC_CSC_LINK 不是合法 base64 —— 请重新设置该 secret：值必须是 \`base64 -i dsh-release.p12 | tr -d '\\n'\` 的完整输出，单行、无引号、无空格"
              exit 1
            fi
            openssl pkcs12 -in "$RUNNER_TEMP/dsh-release.p12" -passin "pass:$DSH_MAC_CSC_KEY_PASSWORD" -nokeys -clcerts -out "$RUNNER_TEMP/dsh-release.crt"
            # 系统/管理员信任域（不加 -k login keychain），headless 下不弹钥匙串授权
            sudo security add-trusted-cert -d -r trustRoot "$RUNNER_TEMP/dsh-release.crt"
          fi
          pnpm run build ${{ startsWith(github.ref, 'refs/tags/') && '--publish onTagOrDraft' || '--publish never' }}
        env:
          # publish.owner/repo in electron-builder.yml use ${env.GH_OWNER} /
          # ${env.GH_REPO} macros (defined in .env locally); CI has no .env
          # file, so provide them here — keep in sync with .env + package.json
          # `repository`.
          GH_OWNER: knight-peter
          GH_REPO: deepseek-harness-desktop
          # 签名身份由 electron-builder.config.cjs 动态计算：CSC_NAME 非空 →
          # 证书签名；否则 ad-hoc（identity='-'，与旧行为一致）。
          # 路线一自签名证书（mac 专用，避免 mac 证书被 Windows signtool 误用）。
          # 生成：scripts/make-self-signed-cert.mjs；把 p12 内容 base64 设为
          # DSH_MAC_CSC_LINK，导出密码设为 DSH_MAC_CSC_KEY_PASSWORD。
          # 必须与本地 x64 构建用同一个 .p12，Squirrel 才接受跨机器更新。
          DSH_MAC_CSC_LINK: ${{ secrets.DSH_MAC_CSC_LINK }}
          DSH_MAC_CSC_KEY_PASSWORD: ${{ secrets.DSH_MAC_CSC_KEY_PASSWORD }}
          # 自动发现被共享 .env 关闭（CSC_IDENTITY_AUTO_DISCOVERY=false），
          # 证书身份靠 CSC_NAME 显式指定；无证书时为空字符串（不参与查找，
          # electron-builder.config.cjs 自动回退 ad-hoc）。
          CSC_NAME: ${{ secrets.DSH_MAC_CSC_LINK != '' && 'dsh-desktop-release' || '' }}
          # 兼容旧的统一 CSC_LINK secret（Windows 代码签名证书走这里）。
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  # NOTE: a GitHub-CI step that mirrors the release to the GitCode `latest`
  # release was tried and removed — the GitHub (US) runner cannot reach the
  # Huawei OBS upload domain (file.gitcode.com): 180s timeouts, zero progress.
  # The mirror is maintained from the local machine instead (x64 direct upload;
  # `download-release` + `sync-domestic --dir` for the full cross-platform set).
  # See docs/plans/国内发布与多更新源方案.md.
