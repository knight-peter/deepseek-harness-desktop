name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is the Apple Silicon (arm64) runner — the only mac build
        # CI ships (Intel x64 packages are built locally and merged into the
        # release by scripts/publish-x64.mjs; see docs/开发总结.md §4.6).
        # Pin the concrete label instead of macos-latest so a future label
        # change cannot silently switch the runner arch.
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          pnpm run lint
          pnpm run typecheck

      - name: Install engine (registry, pinned)
        run: pnpm run install-engine

      - name: Rebuild engine native modules for Electron
        run: pnpm run rebuild-engine

      - name: Compile shell (tsc + copy static)
        run: pnpm run compile

      - name: Engine smoke (Electron-as-Node boot + health + shutdown)
        run: pnpm run smoke

      - name: Package (electron-builder → release/)
        run: pnpm run build
        env:
          # publish.owner/repo in electron-builder.yml use ${env.GH_OWNER} /
          # ${env.GH_REPO} macros (defined in .env locally); CI has no .env
          # file, so provide them here — keep in sync with .env + package.json
          # `repository`.
          GH_OWNER: knight-peter
          GH_REPO: deepseek-harness-desktop
          # macOS signing: Developer ID certificate (base64 p12 + password).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization (electron-builder 26 / notarytool). The mac
          # job notarizes only when these are configured; otherwise the step
          # is skipped with a warning and the artifact stays unsigned/unnotarized.
          # Windows signing uses the same CSC_* vars (Azure Trusted Signing or
          # p12); leave them unset for unsigned builds.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
