<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>dsh-desktop</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #14161a; color: #d6d9de; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #2a2e35; }
    header h1 { margin: 0; font-size: 14px; font-weight: 600; }
    #status { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: #23272f; }
    #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #8b93a1; }
    #status.running .dot { background: #3fb950; }
    #status.error .dot { background: #f85149; }
    #status.starting .dot { background: #d29922; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    #url { color: #79b8ff; text-decoration: none; }
    main { padding: 16px; }
    #detail { color: #f85149; white-space: pre-wrap; }
    #logs { margin-top: 12px; background: #0d0f12; border: 1px solid #2a2e35; border-radius: 6px; padding: 8px; height: 55vh; overflow-y: auto; font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    .log-stderr { color: #f0883e; }
    button { background: #2a2e35; color: #d6d9de; border: 1px solid #3a3f47; border-radius: 6px; padding: 5px 14px; cursor: pointer; }
    button:hover { background: #343a44; }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    button.primary:hover { background: #388bfd; }
    #controls { margin-left: auto; display: flex; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>dsh-desktop</h1>
    <span id="status" class="idle"><span class="dot"></span><span id="status-text">待机</span></span>
    <span id="url"></span>
    <span id="controls">
      <button id="manager">管理（插件/调试/设置）</button>
      <button id="restart" disabled>重启引擎</button>
      <button id="quit">退出</button>
    </span>
  </header>
  <main>
    <div id="detail"></div>
    <div id="logs">— 引擎日志 —</div>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
